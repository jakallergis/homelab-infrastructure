---
# Portainer CE: a web UI to look at the Swarm. It does not own the stacks: change them in Git.
# The server keeps its data in a local volume, so it always runs on docker01.
services:
  agent:
    image: portainer/agent:2.45.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent
    deploy:
      mode: global

  portainer:
    image: portainer/portainer-ce:2.45.3
    # The password file is read only while Portainer has no admin user. After that, change the
    # password in the UI. Without it, Portainer locks itself 5 minutes after the first start.
    command: >-
      -H tcp://tasks.agent:9001 --tlsskipverify
      --admin-password-file /run/secrets/portainer_admin_password
    volumes:
      - data:/data
    networks:
      - agent
      - traefik-public
    secrets:
      - portainer_admin_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker01
      labels:
        - traefik.enable=true
        - traefik.http.routers.portainer.rule=Host(`portainer.lab.krikri.dev`)
        - traefik.http.routers.portainer.entrypoints=web
        - traefik.http.services.portainer.loadbalancer.server.port=9000

networks:
  agent:
    driver: overlay
  traefik-public:
    external: true

volumes:
  data:

# Created by playbooks/stacks.yml from Vault.
secrets:
  portainer_admin_password:
    external: true
