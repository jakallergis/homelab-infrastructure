---
# Strictly read-only health checks.
- name: Check that the Proxmox hosts answer
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Connect over SSH and run the Ansible ping module
      ansible.builtin.ping:

- name: Check the Proxmox cluster, storage and time
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Read the cluster status
      ansible.builtin.command: pvecm status
      register: verify_cluster
      changed_when: false
      check_mode: false

    - name: Check quorum and the member count
      ansible.builtin.assert:
        that:
          - verify_cluster.stdout is search('Quorate:\s+Yes')
          - verify_cluster.stdout is search('^Nodes:\s+' ~ groups['proxmox'] | length ~ '$', multiline=True)
        quiet: true

    - name: Read the storage status
      ansible.builtin.command: pvesm status
      register: verify_storage
      changed_when: false
      check_mode: false

    - name: Check that the storages are active
      ansible.builtin.assert:
        that:
          - verify_storage.stdout is search('^local\s+\S+\s+active', multiline=True)
          - verify_storage.stdout is search('^local-lvm\s+\S+\s+active', multiline=True)
        quiet: true

    - name: Read the time sync state
      ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
      register: verify_time
      changed_when: false
      check_mode: false

    - name: Check that the clock is synchronized
      ansible.builtin.assert:
        that:
          - verify_time.stdout == 'yes'
        quiet: true

- name: Check the Tailscale routers
  hosts: tailscale_routers
  gather_facts: false
  tasks:
    - name: Read the Tailscale login state
      ansible.builtin.command: tailscale status --json
      register: verify_tailscale_status
      changed_when: false
      check_mode: false

    - name: Read the Tailscale settings
      ansible.builtin.command: tailscale debug prefs
      register: verify_tailscale_prefs
      changed_when: false
      check_mode: false

    - name: Read the IP forwarding setting
      ansible.builtin.slurp:
        src: /proc/sys/net/ipv4/ip_forward
      register: verify_ip_forward

    - name: Check the login, the routes and IP forwarding
      ansible.builtin.assert:
        that:
          - (verify_tailscale_status.stdout | from_json).BackendState == 'Running'
          - (verify_prefs.AdvertiseRoutes | default([], true) | sort) == (tailscale_router_routes | sort)
          - not verify_prefs.CorpDNS
          - not verify_prefs.RouteAll
          - (verify_ip_forward.content | b64decode | trim) == '1'
        quiet: true
      vars:
        verify_prefs: "{{ verify_tailscale_prefs.stdout | from_json }}"

# Each server is asked alone, from the workstation, so a working dns01 cannot hide a broken dns02.
# No SSH to the containers: every task runs on the workstation.
- name: Check the DNS servers
  hosts: dns
  gather_facts: false
  tasks:
    - name: Ask for a lab name and a public name
      ansible.builtin.command: dig +short +time=2 +tries=2 @{{ ansible_host }} {{ item }}
      loop:
        - test.{{ lab_domain }}
        - debian.org
      register: verify_dns
      changed_when: false
      check_mode: false
      delegate_to: localhost

    - name: Check the answers
      ansible.builtin.assert:
        that:
          - verify_dns.results[0].stdout_lines == [edge_vip]
          - verify_dns.results[1].stdout_lines | length > 0
        quiet: true

    - name: Check that the web UI answers
      ansible.builtin.uri:
        url: http://{{ ansible_host }}/
      delegate_to: localhost

- name: Check the Docker Swarm
  hosts: swarm_managers
  gather_facts: false
  become: true
  tasks:
    - name: Read the Docker state
      ansible.builtin.command: docker info --format json
      register: verify_docker
      changed_when: false
      check_mode: false

    # The pin "5:29.9.3-1~debian.13~trixie" is Docker version 29.9.3.
    - name: Check the version and that this node is a manager in a full Swarm
      ansible.builtin.assert:
        that:
          - verify_info.ServerVersion == docker_packages['docker-ce'].split(':')[1].split('-')[0]
          - verify_info.Swarm.LocalNodeState == 'active'
          - verify_info.Swarm.ControlAvailable
          - verify_info.Swarm.Managers == groups['swarm_managers'] | length
          - verify_info.Swarm.Nodes == groups['swarm_managers'] | length
        quiet: true
      vars:
        verify_info: "{{ verify_docker.stdout | from_json }}"

    - name: Read the node list
      ansible.builtin.command: docker node ls --format json
      register: verify_nodes
      changed_when: false
      check_mode: false
      run_once: true

    - name: Check that all nodes are ready, with exactly one leader
      ansible.builtin.assert:
        that:
          - verify_node_list | map(attribute='Status') | unique == ['Ready']
          - verify_node_list | selectattr('ManagerStatus', '==', 'Leader') | list | length == 1
          - verify_node_list | rejectattr('ManagerStatus', 'in', ['Leader', 'Reachable']) | list | length == 0
          - verify_node_list | map(attribute='Hostname') | sort == groups['swarm_managers'] | sort
        quiet: true
      run_once: true
      vars:
        verify_node_list: "{{ verify_nodes.stdout_lines | map('from_json') | list }}"

- name: Check the Swarm stacks
  hosts: swarm_managers[0]
  gather_facts: false
  become: true
  vars:
    verify_services:
      - traefik_traefik
      - portainer_agent
      - portainer_portainer
      - adguardhome-sync_sync
  tasks:
    - name: Read the services
      ansible.builtin.command: docker service ls --format json
      register: verify_service_ls
      changed_when: false
      check_mode: false

    # Replicas looks like "2/2" or "2/2 (max 1 per node)": running/wanted.
    - name: Check that each service runs all its replicas
      ansible.builtin.assert:
        that:
          - verify_services | difference(verify_service_list | map(attribute='Name')) | length == 0
          - verify_counts | map('first') | list == verify_counts | map('last') | list
          - verify_counts | map('last') | map('int') | min > 0
        quiet: true
      vars:
        verify_service_list: "{{ verify_service_ls.stdout_lines | map('from_json') | list }}"
        verify_counts: >-
          {{ verify_service_list | selectattr('Name', 'in', verify_services) | map(attribute='Replicas')
             | map('regex_search', '^(\d+)/(\d+)', '\1', '\2') | list }}

    # Host mode: only the nodes that run Traefik answer. A refused connection is a normal result here,
    # so the request does not fail the task. The assertion after it checks the count.
    - name: Ask each manager for the Traefik ping
      ansible.builtin.uri:
        url: http://{{ hostvars[item].ansible_host }}:18080/ping
        timeout: 5
      loop: "{{ groups['swarm_managers'] }}"
      register: verify_ping
      failed_when: false
      delegate_to: localhost

    - name: Check that exactly 2 managers run Traefik
      ansible.builtin.assert:
        that:
          - verify_ping.results | selectattr('status', 'equalto', 200) | list | length == 2
        quiet: true

    - name: Ask for Portainer through Traefik
      ansible.builtin.uri:
        url: http://{{ verify_traefik_node }}:18080/
        headers:
          Host: portainer.{{ lab_domain }}
      delegate_to: localhost
      vars:
        verify_traefik_node: >-
          {{ (verify_ping.results | selectattr('status', 'equalto', 200) | first).url | urlsplit('hostname') }}
