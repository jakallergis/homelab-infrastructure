---
- name: Configure the Proxmox hosts
  hosts: proxmox
  serial: 1
  roles:
    - proxmox_base

- name: Configure the Tailscale routers
  hosts: tailscale_routers
  serial: 1
  roles:
    - tailscale_router

- name: Configure the DNS servers
  hosts: dns
  serial: 1
  become: true
  roles:
    - adguard_install
    - adguard_config
