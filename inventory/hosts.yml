---
# The one source for hosts, addresses and guest IDs. See docs/architecture-target.md.
# vmid = 100 + last octet of ansible_host. pve_node = the Proxmox node that runs the guest.
all:
  children:
    proxmox:
      hosts:
        pve01:
          ansible_host: 192.168.0.11
        pve02:
          ansible_host: 192.168.0.12
        pve03:
          ansible_host: 192.168.0.13
    tailscale_routers:
      hosts:
        pve02:
        pve03:
    debian_guests:
      children:
        swarm_managers:
          hosts:
            docker01:
              ansible_host: 192.168.0.21
              vmid: 121
              pve_node: pve01
              type: debian_vm
              cores: 6
              memory_mb: 8192
              disk_gb: 80
            docker02:
              ansible_host: 192.168.0.22
              vmid: 122
              pve_node: pve02
              type: debian_vm
              cores: 4
              memory_mb: 8192
              disk_gb: 40
            docker03:
              ansible_host: 192.168.0.23
              vmid: 123
              pve_node: pve03
              type: debian_vm
              cores: 4
              memory_mb: 4096
              disk_gb: 40
        dns:
          hosts:
            dns01:
              ansible_host: 192.168.0.31
              vmid: 131
              pve_node: pve03
              type: debian_lxc
              cores: 1
              memory_mb: 512
              disk_gb: 8
            dns02:
              ansible_host: 192.168.0.32
              vmid: 132
              pve_node: pve02
              type: debian_lxc
              cores: 1
              memory_mb: 512
              disk_gb: 8
        edge:
          hosts:
            edge01:
              ansible_host: 192.168.0.33
              vmid: 133
              pve_node: pve01
              type: debian_vm
              cores: 1
              memory_mb: 1024
              disk_gb: 16
            edge02:
              ansible_host: 192.168.0.34
              vmid: 134
              pve_node: pve02
              type: debian_vm
              cores: 1
              memory_mb: 1024
              disk_gb: 16
    # In the inventory for its address and route. Ansible cannot manage HAOS.
    appliances:
      hosts:
        homeassistant:
          ansible_host: 192.168.0.20
          vmid: 120
          pve_node: pve02
