---
# Installs the pinned Docker Engine on a Swarm host. playbooks/swarm_bootstrap.yml makes the Swarm.
- name: Add the Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /usr/share/keyrings/docker.asc
    checksum: sha256:{{ docker_key_sha256 }}
    owner: root
    group: root
    mode: "0644"

- name: Add the Docker repository
  ansible.builtin.copy:
    src: docker.sources
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  register: docker_host_repository
  notify: Refresh the package index

- name: Run the handlers now if a file changed
  ansible.builtin.meta: flush_handlers

# A check-mode run on a new host skips this: the packages are not in the index until the repository
# is really added.
- name: Install and configure Docker
  when: not (ansible_check_mode and docker_host_repository is changed)
  block:
    # The hold stops other apt runs from changing the versions. This task changes them only when
    # the pins in group_vars change.
    - name: Install the pinned packages
      ansible.builtin.apt:
        name: "{{ docker_packages.items() | map('join', '=') | list }}"
        install_recommends: false
        allow_change_held_packages: true

    - name: Hold the packages at these versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ docker_packages.keys() | list }}"

    - name: Write the daemon settings
      ansible.builtin.copy:
        src: daemon.json
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        validate: dockerd --validate --config-file %s
      notify: Restart Docker

    - name: Start Docker and start it at boot
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
